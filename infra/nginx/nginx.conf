# ASLMS reverse proxy (pilot server / State Data Centre).
# Browser → nginx:443 → web (Next.js, which proxies /api/v1 to the API with the user's token).
# The FastAPI service and /metrics are never exposed publicly.

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    client_max_body_size 30m;          # UPLOAD_MAX_MB (25) plus multipart overhead
    proxy_read_timeout 120s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    upstream web { server web:3000; }

    server {
        listen 80;
        server_name _;
        # Redirect to HTTPS once certificates are installed (uncomment the 443 block below).
        # return 301 https://$host$request_uri;

        include /etc/nginx/aslms-locations.conf;
    }

    # server {
    #     listen 443 ssl http2;
    #     server_name aslms.assam.gov.in;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     include /etc/nginx/aslms-locations.conf;
    # }
}
