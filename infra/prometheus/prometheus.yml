global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aslms-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: celery-flower
    metrics_path: /metrics
    static_configs:
      - targets: ["flower:5555"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
