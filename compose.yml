# ASLMS v2 — one command brings the stack up: `docker compose up -d` (migrates and seeds, then the services).
# Services: postgres, redis, init (migrate + seed), worker (the NAPIX load-and-refresh queue), scheduler
# (Celery beat). The API and the portal join as they are built. Variables come from .env (copy .env.example).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aslms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aslms}
      POSTGRES_DB: ${POSTGRES_DB:-aslms}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata_v3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aslms} -d ${POSTGRES_DB:-aslms}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata_v3:/data

  init:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-aslms}:${POSTGRES_PASSWORD:-aslms}@postgres:5432/${POSTGRES_DB:-aslms}
      ASLMS_MIGRATE_URL: postgresql+psycopg://${POSTGRES_USER:-aslms}:${POSTGRES_PASSWORD:-aslms}@postgres:5432/${POSTGRES_DB:-aslms}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && aslms seed"
    restart: "no"

  api:
    # the HTTP API (login, users, access; case endpoints follow). Needs ASLMS_JWT_SECRET in .env.
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-aslms}:${POSTGRES_PASSWORD:-aslms}@postgres:5432/${POSTGRES_DB:-aslms}
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/store
    volumes:
      - ./data:/data
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    command: uvicorn aslms.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  worker:
    # the load-and-refresh pipeline: pulls fetch_queue rows, calls NAPIX (only when NAPIX_ENABLED=true in .env)
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-aslms}:${POSTGRES_PASSWORD:-aslms}@postgres:5432/${POSTGRES_DB:-aslms}
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/store
      CAUSELIST_DIR: /data/causelists
      # the master switch stays off unless the shell that runs `docker compose up` sets it for that run
      NAPIX_ENABLED: ${NAPIX_ENABLED:-false}
    volumes:
      - ./data:/data
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    command: aslms queue-worker
    restart: unless-stopped

  scheduler:
    # Celery beat (06:00 masters, 06:30/18:30 lists, 20:00 status, Sunday 02:00 sweep) enqueues; the worker fetches
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-aslms}:${POSTGRES_PASSWORD:-aslms}@postgres:5432/${POSTGRES_DB:-aslms}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    command: celery -A aslms.jobs.celery_app worker -B --concurrency 1 -l info
    restart: unless-stopped

volumes:
  pgdata_v3:
  redisdata_v3:
