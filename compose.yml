# ASLMS v2: `docker compose up -d` brings the stack up (design deployment-checklist). Variables come from .env (copy
# .env.example); POSTGRES_PASSWORD, ASLMS_APP_PASSWORD, REDIS_PASSWORD and PORTAL_BASE_URL are required and have no
# default. The runbook is docs/operations.md.
#
# Only the `proxy` publishes ports (443, and 80 which only redirects). For development, `.env` sets
# COMPOSE_FILE=compose.yml:compose.dev.yml, which publishes postgres, api and web on 127.0.0.1 only.
#
# Services: postgres, pgbouncer (transaction pooling for api, worker and scheduler), redis (password, memory only),
# clamav (scans every upload), init (preflight, the migration guard, role passwords, seed), api, worker (the NAPIX
# load-and-refresh queue), scheduler (Celery beat and its jobs), web (the Next.js portal), proxy (nginx with TLS,
# body limits and per-address throttling), backup (dumps, store mirror, weekly restore check) and, in profile `ops`,
# migrate (the explicit upgrade with a backup first).
#
# Monitoring (Part B, profile `monitoring`; the pilot's .env sets COMPOSE_PROFILES=monitoring): prometheus,
# alertmanager, grafana, flower, postgres-exporter, redis-exporter, pgbouncer-exporter and ops-exporter. Their
# screens are published on 127.0.0.1 only (Grafana 3001, Prometheus 9090, Alertmanager 9093, Flower 5555): open them
# on the host or through an SSH tunnel, never through the proxy. Profile `monitoring-host` adds node-exporter and cadvisor on a Linux VM.
# ASLMS_READONLY_PASSWORD, GRAFANA_ADMIN_PASSWORD and FLOWER_BASIC_AUTH are required.
#
# Migrations: `init` migrates only a fresh, empty database. An upgrade is explicit: build, `docker compose stop api
# worker scheduler web pgbouncer`, `docker compose --profile ops run --rm migrate`, then `docker compose up -d`.
# Database roles (DB_STANDARD §8): init, migrate and backup alone connect as POSTGRES_USER; api, worker and
# scheduler connect as aslms_app, and their POSTGRES_PASSWORD and ASLMS_MIGRATE_URL are blanked.
# PgBouncer (Part C, decision 29): api, worker and scheduler reach Postgres through pgbouncer:6432 (transaction
# mode); init, migrate, backup and the exporters connect to postgres:5432 directly.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aslms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aslms}
    # sized for 8 GB given to Docker and SSD storage (decision 15); shared_buffers ~25 % of Docker's memory and
    # effective_cache_size 50-75 %. archive_mode stays off (backups are dumps, decision 13).
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=2000
      - -c
      - log_lock_waits=on
      - -c
      - log_temp_files=10MB
      - -c
      - idle_in_transaction_session_timeout=15min
    shm_size: 1gb
    volumes:
      - pgdata_v3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aslms} -d ${POSTGRES_DB:-aslms}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    logging: *logging

  redis:
    # holds the shared NAPIX token and the Celery messages only; password-protected, never published, nothing on
    # disk (decision 6): a restart loses nothing durable (the token is fetched again, beat repeats its jobs, the
    # work list is fetch_queue in Postgres)
    image: redis:7.4.10-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --save
      - ""
      - --appendonly
      - "no"
      - --protected-mode
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    environment:
      # the health check authenticates through the environment, never the process list
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging: *logging

  pgbouncer:
    # connection pooling for api, worker and scheduler (design deployment-checklist, Part C, decision 29): PgBouncer
    # 1.22+ (pinned exactly) from infra/pgbouncer, transaction mode, prepared statements tracked (max_prepared_statements, for
    # psycopg 3), on 6432 inside the Compose network only. The entrypoint writes pgbouncer.ini, the HBA file and a
    # mode-600 userlist.txt into the tmpfs at start: aslms_app may reach the database, aslms_readonly only the
    # `pgbouncer` console (SHOW, for the exporter); nobody is an admin. It starts after init, so a changed role
    # password is in the database before PgBouncer logs in with it. Stop it with the application services before
    # `migrate` or `ops restore`: its server connections are aslms_app sessions.
    build: ./infra/pgbouncer
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aslms}
      ASLMS_APP_PASSWORD: ${ASLMS_APP_PASSWORD:?set ASLMS_APP_PASSWORD in .env}
      ASLMS_READONLY_PASSWORD: ${ASLMS_READONLY_PASSWORD:?set ASLMS_READONLY_PASSWORD in .env}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      PGBOUNCER_MAX_PREPARED_STATEMENTS: ${PGBOUNCER_MAX_PREPARED_STATEMENTS:-200}
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    # the healthcheck logs in through the pool as aslms_app and runs SELECT 1 (design pre-pilot-hardening, decision
    # 8): "healthy" means the application can log in. The script reads the password from the container's
    # environment; nothing is interpolated here.
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/pgbouncer-healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    <<: *hardening
    logging: *logging

  clamav:
    # the virus scanner behind uploads (design documents-uploads): clamd on 3310 inside the Compose network only.
    # Signatures: freshclam over the internet by default; compose.clamav-mirror.yml or compose.clamav-offline.yml
    # in COMPOSE_FILE for a closed network (decision 17). The first start downloads the signatures (minutes);
    # until the healthcheck passes, uploads answer 503 scanner_unavailable. There is no off switch.
    image: clamav/clamav:1.5.4
    volumes:
      - clamdb_v3:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *logging

  init:
    # preflight (refuses weak or missing settings when APP_ENV=prod; an unknown APP_ENV or a libpq older than 17 at
    # every APP_ENV), the document-store check (the store and its folders writable by uid 10001; design
    # pre-pilot-hardening, decision 3), the migration guard (migrates only a fresh database; exits 3 when an upgrade
    # is needed), the role passwords (sent as SCRAM verifiers) and the seed, as the cluster owner
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-aslms}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-aslms}
      ASLMS_MIGRATE_URL: postgresql+psycopg://${POSTGRES_USER:-aslms}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-aslms}
      POSTGRES_USER: ${POSTGRES_USER:-aslms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:?set PORTAL_BASE_URL in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # read by preflight (Part B): the read-only role (db-roles sets it), the monitoring logins and the profiles
      ASLMS_READONLY_PASSWORD: ${ASLMS_READONLY_PASSWORD:?set ASLMS_READONLY_PASSWORD in .env}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:?set FLOWER_BASIC_AUTH in .env}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      STORAGE_DIR: /data/store
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "aslms ops preflight && aslms ops store-check && aslms ops db-guard && aslms db-roles && aslms seed"
    restart: "no"
    <<: *hardening
    logging: *logging

  api:
    # the HTTP API. Needs ASLMS_JWT_SECRET in .env. Uploads go to clamav before the store; the api does not wait for
    # clamav to be healthy (503 until it is). Reached only by `web` (no published port).
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg://aslms_app:${ASLMS_APP_PASSWORD:?set ASLMS_APP_PASSWORD in .env}@pgbouncer:6432/${POSTGRES_DB:-aslms}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      STORAGE_DIR: /data/store
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      # request metrics for Prometheus on the internal port (Part B, decision 24); not published, not proxied
      API_METRICS_PORT: "9100"
      # the owner's credentials never reach an application process (row 82)
      POSTGRES_PASSWORD: ""
      ASLMS_MIGRATE_URL: ""
      # the same master switch as the worker, for the portal's own court calls (court search, fetch from court,
      # the data-load fetch, System health's Test now); off unless the shell that runs `docker compose up` sets it
      NAPIX_ENABLED: ${NAPIX_ENABLED:-false}
    volumes:
      - ./data:/data
      # the NAPIX documents behind admin.service_health, read-only (design system-health-inspector, decision 12)
      - ./docs/specs/pdf:/app/napix-docs:ro
    depends_on:
      init:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      clamav:
        condition: service_started
    networks:
      - default
      - portal
    # X-Forwarded-For is trusted only from the web container (design portal-shell, decision 7): audit rows then
    # carry the browser's address, which the proxy writes and web forwards (decision 8).
    command: uvicorn aslms.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips ${WEB_IP:-172.28.0.10}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    <<: *hardening
    logging: *logging

  worker:
    # the load-and-refresh pipeline: pulls fetch_queue rows, calls NAPIX only while the master switch is on
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg://aslms_app:${ASLMS_APP_PASSWORD:?set ASLMS_APP_PASSWORD in .env}@pgbouncer:6432/${POSTGRES_DB:-aslms}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      STORAGE_DIR: /data/store
      CAUSELIST_DIR: /data/causelists
      POSTGRES_PASSWORD: ""
      ASLMS_MIGRATE_URL: ""
      # the master switch stays off unless the shell that runs `docker compose up` sets it for that run
      NAPIX_ENABLED: ${NAPIX_ENABLED:-false}
    volumes:
      - ./data:/data
    depends_on:
      init:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: aslms queue-worker
    restart: unless-stopped
    <<: *hardening
    logging: *logging

  scheduler:
    # Celery beat (06:00 masters, 06:30/18:30 lists, 20:00 status, Sunday 02:00 sweep, 03:00 dedupe sweep) enqueues; the worker fetches.
    # Every 15 minutes `rescore-dirty` rescores the cases when a matching rule, an office or the scoring settings changed.
    # Every 5 minutes `extract-text` extracts the text of pending order PDFs and uploads (it reads the store).
    # Alerts (design alerts-notifications): `alerts-scan-events` every 5 minutes, `alerts-sweep-dates` hourly,
    # `notifications-send` every 2 minutes (mail through MAIL_BACKEND of the env file), `digests-build` 08:00 IST.
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg://aslms_app:${ASLMS_APP_PASSWORD:?set ASLMS_APP_PASSWORD in .env}@pgbouncer:6432/${POSTGRES_DB:-aslms}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      STORAGE_DIR: /data/store
      POSTGRES_PASSWORD: ""
      ASLMS_MIGRATE_URL: ""
    volumes:
      - ./data:/data
    depends_on:
      init:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The image runs as uid 10001 and /app is root-owned, so beat keeps its schedule file in /tmp (lost on recreate,
    # which only means each crontab entry next fires at its next due time).
    command: celery -A aslms.jobs.celery_app worker -B -s /tmp/celerybeat-schedule --concurrency 1 -l info
    restart: unless-stopped
    <<: *hardening
    logging: *logging

  web:
    # the portal (design portal-shell): a backend-for-frontend that keeps the tokens in httpOnly cookies and relays
    # the browser's calls to the api. No env_file: no secret (JWT, NAPIX, mail) ever enters this container. One
    # process only (the refresh single-flight assumes it): never scaled, no replicas (decision 11). Reached only
    # through the proxy, so it trusts the proxy's X-Forwarded-For (rightmost entry, decision 8).
    build: ./frontend
    environment:
      API_BASE_URL: http://api:8000
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:?set PORTAL_BASE_URL in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ASLMS_REFRESH_TOKEN_DAYS: ${ASLMS_REFRESH_TOKEN_DAYS:-14}
      RELAY_TIMEOUT_SECONDS: ${RELAY_TIMEOUT_SECONDS:-120}
      TRUST_PROXY_HEADERS: "true"
    networks:
      portal:
        ipv4_address: ${WEB_IP:-172.28.0.10}
      edge: {}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    <<: *hardening
    logging: *logging

  proxy:
    # nginx with TLS in front of web (decisions 7-10): the only published ports; port 80 only redirects; any Host
    # other than PORTAL_BASE_URL's is refused (444). Overwrites X-Forwarded-For with the client's address, limits
    # request bodies to the API's own limits, throttles per address (429 `throttled`). It joins only the `edge`
    # network, so it cannot reach the api, postgres or redis. The certificate and key are
    # infra/proxy/certs/fullchain.pem and privkey.pem (`aslms ops make-cert`, or a NIC / SDC certificate).
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${PROXY_BIND:-0.0.0.0}:${PROXY_HTTPS_PORT:-443}:443"
      - "${PROXY_BIND:-0.0.0.0}:${PROXY_HTTP_PORT:-80}:80"
    environment:
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:?set PORTAL_BASE_URL in .env}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-20971520}
      ATTACHMENTS_MAX_FILES: ${ATTACHMENTS_MAX_FILES:-5}
      RELAY_TIMEOUT_SECONDS: ${RELAY_TIMEOUT_SECONDS:-120}
      PROXY_TRUSTED_UPSTREAM: ${PROXY_TRUSTED_UPSTREAM:-}
      PROXY_SESSION_RATE: ${PROXY_SESSION_RATE:-20r/m}
      PROXY_SESSION_BURST: ${PROXY_SESSION_BURST:-20}
      PROXY_API_RATE: ${PROXY_API_RATE:-30r/s}
      PROXY_API_BURST: ${PROXY_API_BURST:-100}
      PROXY_CONN_PER_IP: ${PROXY_CONN_PER_IP:-50}
      NGINX_ENVSUBST_FILTER: "^PROXY_"
    volumes:
      - ./infra/proxy/aslms.conf.template:/etc/nginx/templates/aslms.conf.template:ro
      - ./infra/proxy/15-aslms-limits.sh:/docker-entrypoint.d/15-aslms-limits.sh:ro
      - ./infra/proxy/certs:/etc/nginx/certs:ro
    networks:
      - edge
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging: *logging

  backup:
    # dumps of the database and the roles, an add-only mirror of the document store, retention, every
    # BACKUP_INTERVAL_HOURS hours at minute 30 IST, and the restore check on Sunday 04:30 IST (decisions 13, 14).
    # BACKUP_DIR (host path, default ./backups) belongs on a second physical disk; copy it off the machine weekly.
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-aslms}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-aslms}
      ASLMS_MIGRATE_URL: postgresql+psycopg://${POSTGRES_USER:-aslms}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-aslms}
      STORAGE_DIR: /data/store
      BACKUP_DIR: /backups
    volumes:
      - ./data:/data:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      init:
        condition: service_completed_successfully
    command: aslms ops backup-scheduler
    restart: unless-stopped
    <<: *hardening
    logging: *logging

  migrate:
    # profile `ops`: never started by `up`. The explicit upgrade: preflight, refuse while aslms_app is connected,
    # a `pre-migrate` backup checked with pg_restore --list, `alembic upgrade head`, seed, audit `system.migrated`.
    # Also the service for `aslms ops restore` (it mounts the store read-write). The source tree is mounted read-only
    # at /src: `aslms ops migrate` refuses (exit 5) an image built from other code than ./backend (design
    # followups-oct, decision 26; docs/operations.md section 6).
    build: ./backend
    profiles: ["ops"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-aslms}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-aslms}
      ASLMS_MIGRATE_URL: postgresql+psycopg://${POSTGRES_USER:-aslms}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-aslms}
      POSTGRES_USER: ${POSTGRES_USER:-aslms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:?set PORTAL_BASE_URL in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # read by preflight (Part B): the read-only role (db-roles sets it), the monitoring logins and the profiles
      ASLMS_READONLY_PASSWORD: ${ASLMS_READONLY_PASSWORD:?set ASLMS_READONLY_PASSWORD in .env}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:?set FLOWER_BASIC_AUTH in .env}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      STORAGE_DIR: /data/store
      BACKUP_DIR: /backups
    volumes:
      - ./data:/data
      - ${BACKUP_DIR:-./backups}:/backups
      - ./backend:/src:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "aslms ops preflight --component migrate && aslms ops migrate"
    restart: "no"
    <<: *hardening
    logging: *logging

  # ---------------------------------------------------------------------------------------------- monitoring (Part B)

  prometheus:
    # scrapes the api's request metrics, the exporters, Grafana and Alertmanager; evaluates infra/prometheus/rules.yml
    # (tested by `promtool test rules`, docs/operations.md section 17); keeps 30 days
    image: prom/prometheus:v3.7.2
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.listen-address=:9090
      - --web.external-url=http://127.0.0.1:9090
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_v3:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    <<: *hardening
    logging: *logging

  alertmanager:
    # mails the alerts to OPS_ALERT_EMAIL through the SMTP_* relay; without SMTP_HOST or OPS_ALERT_EMAIL they are only
    # shown here and in Grafana. The entrypoint renders the configuration into a tmpfs; the SMTP password goes into a
    # mode-600 file there, never into a file on disk.
    image: prom/alertmanager:v0.29.0
    profiles: ["monitoring"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
      - alertmanager_v3:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    <<: *hardening
    logging: *logging

  grafana:
    # dashboards provisioned from infra/grafana (ASLMS overview, PostgreSQL, Redis and Celery); Prometheus is the only
    # data source, never the database. Sign in as admin with GRAFANA_ADMIN_PASSWORD (applied when the volume is
    # first created; rotation in docs/operations.md section 5).
    image: grafana/grafana:12.2.1
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:3001
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_v3:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    <<: *hardening
    logging: *logging

  flower:
    # the Celery side (beat's tasks run by the scheduler); basic auth from FLOWER_BASIC_AUTH (user:password). The queue
    # worker is not a Celery worker: its liveness is the ops exporter's aslms_worker_last_pass_timestamp.
    image: mher/flower:2.0.1
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:?set FLOWER_BASIC_AUTH in .env}
      FLOWER_PORT: "5555"
      FLOWER_PURGE_OFFLINE_WORKERS: "3600"
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    <<: *hardening
    logging: *logging

  postgres-exporter:
    # the database statistics as aslms_readonly, a member of pg_monitor (migration 0020, decision 27)
    image: quay.io/prometheuscommunity/postgres-exporter:v0.18.1
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-aslms}?sslmode=disable
      DATA_SOURCE_USER: aslms_readonly
      DATA_SOURCE_PASS: ${ASLMS_READONLY_PASSWORD:?set ASLMS_READONLY_PASSWORD in .env}
    depends_on:
      init:
        condition: service_completed_successfully
    <<: *hardening
    logging: *logging

  redis-exporter:
    # Redis memory, clients and the Celery queue length (the `celery` list in db 0)
    image: oliver006/redis_exporter:v1.78.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDIS_EXPORTER_CHECK_SINGLE_KEYS: db0=celery
    depends_on:
      redis:
        condition: service_healthy
    <<: *hardening
    logging: *logging

  pgbouncer-exporter:
    # PgBouncer's pools (clients waiting, server connections) from its `pgbouncer` console, as aslms_readonly, a stats
    # user there (SHOW only); PgBouncerClientsWaiting fires when clients wait for a server connection for 5 minutes
    image: quay.io/prometheuscommunity/pgbouncer-exporter:v0.12.1
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      PGBOUNCER_EXPORTER_CONNECTION_STRING: postgres://aslms_readonly:${ASLMS_READONLY_PASSWORD:?set ASLMS_READONLY_PASSWORD in .env}@pgbouncer:6432/pgbouncer?sslmode=disable
    depends_on:
      pgbouncer:
        condition: service_healthy
    <<: *hardening
    logging: *logging

  ops-exporter:
    # `aslms ops metrics` (decision 23): queue, jobs, worker liveness, NAPIX window, mail, SourceTrace, backups (the
    # status files, read-only), disk, ClamAV signatures, the portal probe through the proxy and the certificate's
    # expiry. Read-only, as aslms_readonly; no env_file, so no NAPIX, mail or JWT secret enters it. It joins `edge`
    # to probe the proxy and web, and `default` for postgres, clamav and the api.
    build: ./backend
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      DATABASE_URL_SYNC: postgresql+psycopg://aslms_readonly:${ASLMS_READONLY_PASSWORD:?set ASLMS_READONLY_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-aslms}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:?set PORTAL_BASE_URL in .env}
      BACKUP_DIR: /backups
      OPS_DISK_PATHS: /data,/backups
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      # the master switch as the worker sees it, for aslms_napix_switch_on; this process never calls NAPIX
      NAPIX_ENABLED: ${NAPIX_ENABLED:-false}
      NAPIX_RATE_WINDOW_SECONDS: ${NAPIX_RATE_WINDOW_SECONDS:-3600}
      NAPIX_WINDOW_MARGIN_SECONDS: ${NAPIX_WINDOW_MARGIN_SECONDS:-60}
      NAPIX_WINDOW_PROBE_SECONDS: ${NAPIX_WINDOW_PROBE_SECONDS:-180}
      NAPIX_WINDOW_RESET_JUMP: ${NAPIX_WINDOW_RESET_JUMP:-50}
    volumes:
      - ./data:/data:ro
      - ${BACKUP_DIR:-./backups}:/backups:ro
    networks:
      - default
      - edge
    depends_on:
      init:
        condition: service_completed_successfully
    command: aslms ops metrics --port 9108
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/metrics', timeout=50)"]
      interval: 60s
      timeout: 55s
      retries: 3
      start_period: 30s
    <<: *hardening
    logging: *logging

  node-exporter:
    # profile `monitoring-host` (decision 28): host metrics on a Linux VM at the SDC; not on Docker Desktop, where it
    # would describe Docker's VM
    image: prom/node-exporter:v1.10.2
    profiles: ["monitoring-host"]
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    <<: *hardening
    logging: *logging

  cadvisor:
    # profile `monitoring-host`: per-container CPU, memory and I/O on a Linux VM. It reads the Docker socket and
    # needs privileged mode, so it is optional and never used on Docker Desktop.
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    profiles: ["monitoring-host"]
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    security_opt:
      - no-new-privileges:true
    logging: *logging

networks:
  # postgres, redis, clamav and the backend services
  default: {}
  # web <-> api, with a fixed subnet so the api can trust X-Forwarded-For from the web container's address only
  portal:
    ipam:
      config:
        - subnet: ${ASLMS_SUBNET:-172.28.0.0/24}
  # proxy <-> web only (and the ops exporter's probes of both)
  edge: {}

volumes:
  pgdata_v3:
  clamdb_v3:
  prometheus_v3:
  alertmanager_v3:
  grafana_v3:
