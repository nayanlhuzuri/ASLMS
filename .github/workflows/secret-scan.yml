# Weekly secret scan over the whole history (design github-and-ci, decision 8): gitleaks with .gitleaks.toml and
# repo_policy.py history. A failure e-mails the repository owner through GitHub's standard notification. A true
# finding is never "fixed" by an agent: the owner rotates the key and decides on the history (operations.md 19).
name: Secret scan

on:
  schedule:
    - cron: "0 21 * * 0" # Sunday 21:00 UTC = Monday 02:30 IST
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1

jobs:
  history:
    name: full history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: repo_policy history
        run: python3 backend/tools/repo_policy.py history --branch HEAD
      - name: gitleaks over the whole history
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "$GITLEAKS_IMAGE" git /repo --config /repo/.gitleaks.toml --redact --no-banner
