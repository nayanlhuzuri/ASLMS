# ASLMS v2 — the whole application in containers.
#
#   docker compose up -d --build        then open http://localhost:3000   (sign-in codes: http://localhost:8025)
#
# First start: `init` migrates the database, seeds it and, on a laptop, loads the demo departments and accounts
# (password Demo@2026pass). Every value below has a working default; `.env` is optional and overrides them.
# Pilot server / State Data Centre: add docker-compose.prod.yml (see docs/operations.md).
# Queue names in the worker commands MUST match backend/aslms/jobs/celery_app.py task_routes.

x-backend: &backend
  build: ./backend
  image: aslms-backend:latest
  env_file:
    - path: .env
      required: false
  environment: &app_env
    # the application connects as aslms_app; migrations and seeding run as the owner (DB_STANDARD §8)
    DATABASE_URL_SYNC: postgresql+psycopg://aslms_app:${ASLMS_APP_PASSWORD:-aslms_app}@postgres:5432/${POSTGRES_DB:-aslms}
    ASLMS_MIGRATE_URL: postgresql+psycopg://${POSTGRES_USER:-aslms}:${POSTGRES_PASSWORD:-aslms}@postgres:5432/${POSTGRES_DB:-aslms}
    ASLMS_APP_PASSWORD: ${ASLMS_APP_PASSWORD:-aslms_app}
    ASLMS_READONLY_PASSWORD: ${ASLMS_READONLY_PASSWORD:-aslms_readonly}
    REDIS_URL: redis://redis:6379/0
    CAUSE_LIST_DIR: /data/causelists
    STORAGE_ROOT: /data/storage
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    NAPIX_ENABLED: ${NAPIX_ENABLED:-false}
    CLAMAV_HOST: ${CLAMAV_HOST:-}
    # on a laptop every e-mail (sign-in codes, alerts) lands in Mailpit: http://localhost:8025
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  volumes:
    - ./data/causelists:/data/causelists:ro
    - ./data/storage:/data/storage
  depends_on:
    init: { condition: service_completed_successfully }
    redis: { condition: service_started }

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aslms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aslms}
      POSTGRES_DB: ${POSTGRES_DB:-aslms}
    ports: ["${POSTGRES_HOST_PORT:-5433}:5432"]   # host port 5433: a native PostgreSQL often holds 5432 on Windows
    volumes: ["pgdata_v2:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aslms} -d ${POSTGRES_DB:-aslms}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata_v2:/data"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]   # web inbox; SMTP 1025 stays inside the compose network

  clamav:
    image: clamav/clamav:stable
    volumes: ["clamdb:/var/lib/clamav"]
    profiles: ["scan"]   # optional on a laptop (`--profile scan`, set CLAMAV_HOST=clamav); required in production

  # one-shot: migrations, seed, demo data on a first laptop run; everything else waits for it
  init:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && aslms bootstrap $${SEED_DEMO:+--demo}"]
    environment:
      <<: *app_env
      # the owner: creates the roles on the first run and seeds as the owner
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-aslms}:${POSTGRES_PASSWORD:-aslms}@postgres:5432/${POSTGRES_DB:-aslms}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *backend
    # the portal is the only client; trust its X-Forwarded-For so audit rows record the real address
    command: uvicorn aslms.api.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips=*
    ports: ["8000:8000"]   # API docs at http://localhost:8000/api/docs (dev only)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker-ingest:
    <<: *backend
    command: celery -A aslms.jobs.celery_app worker -Q ingest,default -c 2 --loglevel=INFO

  worker-track:
    <<: *backend
    command: celery -A aslms.jobs.celery_app worker -Q track -c 4 --loglevel=INFO

  worker-documents:
    <<: *backend
    command: celery -A aslms.jobs.celery_app worker -Q documents -c 2 --loglevel=INFO

  worker-notify:
    <<: *backend
    command: celery -A aslms.jobs.celery_app worker -Q notify -c 2 --loglevel=INFO

  beat:
    <<: *backend
    command: celery -A aslms.jobs.celery_app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule

  flower:
    <<: *backend
    command: celery -A aslms.jobs.celery_app flower --port=5555
    ports: ["5555:5555"]
    profiles: ["monitoring"]

  web:
    build: ./frontend
    image: aslms-web:latest
    environment:
      API_BASE_URL: http://api:8000
      NODE_ENV: production
      # cookies without the Secure flag so http://localhost works; the production override turns it on
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata_v2:
  redisdata_v2:
  clamdb:
