[project]
name = "aslms"
version = "2.0.0"
description = "Assam State Legal Management System — Legal Case Monitoring Portal backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "httpx>=0.27",
  "tenacity>=8.5",
  "cryptography>=43",
  "pymupdf>=1.24",
  "structlog>=24",
  "typer>=0.12",
  "rich>=13",
  "pyjwt>=2.9",
  "argon2-cffi>=23",
  "python-multipart>=0.0.9",
  "clamd>=1.0.2",
  "openpyxl>=3.1",
  "prometheus-client>=0.20",
  "flower>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[project.scripts]
aslms = "aslms.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aslms*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B905", "E741"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
