[project]
name = "aslms"
version = "3.0.0a0"
description = "Assam State Legal Management System — Legal Case Monitoring Portal backend"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "cryptography>=43",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24",
  "typer>=0.12",
  "rich>=13",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "uuid6>=2024.7",
  "pymupdf>=1.24",
  "celery>=5.4",
  "redis>=5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "argon2-cffi>=23",
  "pyjwt>=2.9",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
  "xlsxwriter>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
redis = ["redis>=5"]

[project.scripts]
aslms = "aslms.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aslms*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B905", "E741"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
