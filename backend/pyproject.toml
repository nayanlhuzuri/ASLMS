[project]
name = "aslms"
version = "3.0.0a0"
description = "ASLMS — Assam State Litigation Management System, backend"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "cryptography>=43",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24",
  "typer>=0.12",
  "rich>=13",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "uuid6>=2024.7",
  "pymupdf>=1.24,<2",  # design document-ocr, decision 2: 2.x loads onnxruntime layout models at import
  "celery>=5.4",
  "kombu>=5.4",
  # kombu 5.7.0's Redis transport imports `packaging` without declaring it, so the scheduler failed to start
  # (3 Nov 2026). Declared here so the image set (requirements/image.txt) keeps it; CI's dev set has it through pytest
  # and would hide its absence (design dependency-locks, decision 11)
  "packaging>=24",
  "redis>=5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "argon2-cffi>=23",
  "pyjwt>=2.9",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
  "xlsxwriter>=3.2",
  # design offices-import, decision 21: `aslms offices import` reads the owner's workbook; defusedxml makes openpyxl
  # parse its XML defensively
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "pyyaml>=6", "uv>=0.13.7"]
redis = ["redis>=5"]

[dependency-groups]
# the build backend, locked and hash-checked so both installs run with --no-build-isolation (design dependency-locks,
# decision 3); [build-system] requires stays for a build with isolation
build = ["setuptools>=68"]

[project.scripts]
aslms = "aslms.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aslms*"]

[tool.uv]
# design dependency-locks, decisions 1 and 9: one universal lock (uv.lock) for the image and CI (Linux x86_64, Python
# 3.12) and the development .venv (Windows AMD64, Python 3.13). Refresh it only with `python tools/deps.py lock`.
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B905", "E741"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "migration_cycle: the test calls command.upgrade / downgrade and holds the cluster lock (tests/db/rundb.py)",
]
