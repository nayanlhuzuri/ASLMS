[project]
name = "aslms"
version = "3.0.0a0"
description = "ASLMS — Assam State Litigation Management System, backend"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "cryptography>=43",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24",
  "typer>=0.12",
  "rich>=13",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "uuid6>=2024.7",
  "pymupdf>=1.24,<2",  # design document-ocr, decision 2: 2.x loads onnxruntime layout models at import
  "celery>=5.4",
  # kombu 5.7.0 imports `packaging` in its Redis transport without declaring it, so the scheduler failed to start
  # (3 Nov 2026); held below 5.7 to match the CI constraints (kombu 5.6.2) until the lock file of row 98
  "kombu>=5.4,<5.7",
  "packaging>=24",
  "redis>=5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "argon2-cffi>=23",
  "pyjwt>=2.9",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
  "xlsxwriter>=3.2",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "pyyaml>=6"]
redis = ["redis>=5"]

[project.scripts]
aslms = "aslms.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aslms*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B905", "E741"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "migration_cycle: the test calls command.upgrade / downgrade and holds the cluster lock (tests/db/rundb.py)",
]
