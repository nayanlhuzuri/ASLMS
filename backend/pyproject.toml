[project]
name = "aslms"
version = "3.0.0a0"
description = "Assam State Legal Management System — Legal Case Monitoring Portal backend"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "cryptography>=43",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
redis = ["redis>=5"]

[project.scripts]
aslms = "aslms.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aslms*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B905", "E741"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
