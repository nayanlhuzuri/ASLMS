# Development only (design deployment-checklist, decision 2). A developer's .env sets
# COMPOSE_FILE=compose.yml:compose.dev.yml so `docker compose up -d` stays one command. Every port is bound to
# 127.0.0.1, so the development layout cannot reach the LAN: postgres for the host-run pytest and psql, api for the
# OpenAPI pages and CLI checks, web for the portal at http://localhost:3000. Redis is never published (host-run
# commands go through `docker compose exec`). The proxy starts only with `--profile proxy` here (it needs a
# certificate in infra/proxy/certs); web is reached directly, so it does not trust X-Forwarded-For.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
  api:
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
  web:
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    environment:
      TRUST_PROXY_HEADERS: "false"
  proxy:
    profiles: ["proxy"]
  ops-exporter:
    environment:
      # the HTTPS proxy does not run in development (it starts only with --profile proxy), so the portal probe
      # through it would raise PortalDown for ever; a blank URL is not probed. web and api are still probed.
      OPS_PROBE_PORTAL_URL: ""
  uicheck:
    # the real-browser layout check (design portal-ui-polish, decisions 18-22): Playwright with Chromium at 375, 768
    # and 1280 px against the running web service, with a synthetic API answered inside the browser. It joins only
    # the edge network (it reaches http://web:3000 and nothing else), reads no env_file and holds no secret, runs as
    # the image's non-root pwuser, and writes screenshots, findings.json and index.html to ./data/uicheck (gitignored).
    # Run: docker compose --profile uicheck run --rm uicheck
    profiles: ["uicheck"]
    build:
      context: ./frontend
      dockerfile: e2e/Dockerfile
      args:
        PLAYWRIGHT_VERSION: "1.64.1"
    networks:
      - edge
    depends_on:
      web:
        condition: service_healthy
    user: pwuser
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/uicheck:/out
